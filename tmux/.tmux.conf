# Prefix
set -g prefix C-k
bind C-k send-prefix
unbind C-b
unbind C-a

# Shell and responsiveness
set -g default-shell /bin/zsh
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on
set -g display-time 4000
set -g status-interval 5

# Keep numbering predictable.
set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload and session control.
bind r source-file ~/.tmux.conf \; display-message 'Reloaded ~/.tmux.conf'
unbind d
bind q detach-client
bind Q confirm-before -p 'Kill tmux server? (y/n)' kill-server

# Create windows and splits in the current pane's directory.
bind c new-window -c '#{pane_current_path}'
bind _ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# Vim-style pane navigation and resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind \\ last-pane
bind z resize-pane -Z
bind C-l send-keys C-l

# Window management. Ctrl-h / Ctrl-l switch windows without the prefix.
bind n swap-window -t +1
bind p swap-window -t -1
bind w choose-tree -Zw
bind -n C-h previous-window
bind -n C-l next-window

# Popups, always rooted in the active pane's directory.
bind -r g display-popup -d '#{pane_current_path}' -w 80% -h 80% -E 'git client'
bind -r t display-popup -d '#{pane_current_path}' -w 80% -h 80% -E 'tms -f'
bind -r s display-popup -d '#{pane_current_path}' -w 80% -h 80% -E 'tms -n'

# One persistent OpenCode session per directory. `shasum` is available on macOS
# and avoids the Linux-only `md5sum`; unsetting TMUX permits attaching in a popup.
bind -r a run-shell -b 'path=#{q:pane_current_path}; session="opencode-$(printf "%s" "$path" | shasum -a 256 | cut -c1-8)"; tmux has-session -t "=$session" 2>/dev/null || tmux new-session -d -s "$session" -c "$path" opencode; tmux display-popup -d "$path" -w 80% -h 80% -E "env -u TMUX tmux attach-session -t $session"'

# Copy mode and clipboard (macOS).
setw -g mode-keys vi
set -g mouse on
set -g set-clipboard on
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Y send-keys -X copy-pipe 'pbcopy'
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
bind P paste-buffer
bind -T root M-v paste-buffer

# Appearance
set -g status-position bottom
set -g status-justify left
set -g status-style bg=default
set -g status-left ' '
set -g status-left-length 90
set -g status-right '#[fg=yellow,bold] [#S] '
set -g status-right-length 40
set -g message-command-style fg=black,bg=white
set -g message-style fg=black,bg=white
setw -g window-status-format '#[fg=gray] #I:#W '
setw -g window-status-current-format '#[fg=white,bold][#I:#W]'

# Terminal capability and true colour.
set -g default-terminal 'tmux-256color'
set -as terminal-overrides ',*:RGB'
